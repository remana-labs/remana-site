name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest   # public repo: never self-hosted
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the policy change-log guard reads real file history
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env: { PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA }   # Cloudflare's always-pass test key; CI is not production
      - run: npm test
