name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest   # public repo: never the org's self-hosted runners
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the policy change-log guard reads real file history
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env: { PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFFBWo8mbSSlV_Qw }   # public site key; the same build is tested and deployed
      - run: npm test
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'   # main only (see `on`); PR builds are never deployed
        run: npx wrangler pages deploy dist --project-name remana-site --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
